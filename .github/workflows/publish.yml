name: Publish to PyPI

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate version
        run: |
          VERSION=$(sed -n "s/^__version__ = '\(.*\)'/\1/p" strata/__init__.py)
          echo "Package version: $VERSION"
          if echo "$VERSION" | grep -qi 'dev'; then
            echo "::error::Version $VERSION contains dev suffix."
            exit 1
          fi
          TAG=${GITHUB_REF#refs/tags/}
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match __version__ ($VERSION)"
            exit 1
          fi
      - name: Build package
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/strata
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Wait for PyPI
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          for i in $(seq 1 30); do
            if curl -s -f "https://pypi.org/pypi/strata/$TAG/json" > /dev/null; then
              echo "strata $TAG available on PyPI"
              break
            fi
            echo "Waiting for PyPI propagation (attempt $i/30)..."
            sleep 10
          done
      - name: Install from PyPI and verify
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          uv pip install --system strata==$TAG --index-url https://pypi.org/simple/
          INSTALLED=$(cd /tmp && python -c "import strata; print(strata.__version__)")
          echo "Installed version: $INSTALLED"
          if [ "$INSTALLED" != "$TAG" ]; then
            echo "::error::Installed version $INSTALLED does not match tag $TAG"
            exit 1
          fi
      - name: Run tests
        run: |
          uv pip install --system pytest
          pytest strata/tests/ -v
