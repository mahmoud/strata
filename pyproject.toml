[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "strata"
dynamic = ["version"]
description = "Multi-dimensional, topologically-driven, dependency-resolving configuration framework, built to handle the complexities of advanced projects."
readme = "README.md"
authors = [
    {name = "Mahmoud Hashemi", email = "mahmoud@hatnote.com"},
]
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "boltons>=20.0.0",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/mahmoud/strata"
Repository = "https://github.com/mahmoud/strata"
Changelog = "https://github.com/mahmoud/strata/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "coverage[toml]>=7",
    "pytest>=8",
    "ruff>=0.5",
    "tox>=4",
    "tox-uv>=1",
]

[tool.flit.sdist]
include = ["strata/tests/", "tox.ini", "LICENSE", "README.md", "CHANGELOG.md", "docs/"]

[tool.pytest.ini_options]
testpaths = ["strata/tests"]

[tool.coverage.run]
branch = true
source = ["strata"]
omit = ["*/strata/tests/*"]

[tool.coverage.paths]
source = [
    "strata",
    "*/site-packages/strata",
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "except ImportError",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["UP031"]  # printf-style formatting is house style
